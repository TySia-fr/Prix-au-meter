# Production stack for the VPS. Usage:
#   cp .env.example .env   # then set real secrets
#   docker compose up -d db
#   docker compose run --rm tools pnpm db:migrate
#   docker compose run --rm tools pnpm data:import --dept 34 --years 2021-2025
#   docker compose up -d app
# Nginx on the host terminates TLS and proxies to 127.0.0.1:3000.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pam}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pam}"]
      interval: 5s
      retries: 10
    # Not published on the host: only reachable from the compose network.

  app:
    build: { context: ., target: runtime }
    image: prix-au-metre:latest
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pam}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pam}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL}
      GEOCODER_URL: ${GEOCODER_URL:-https://data.geopf.fr/geocodage}
    ports:
      - "127.0.0.1:3000:3000"

  tools:
    build: { context: ., target: tools }
    profiles: ["tools"]
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pam}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pam}
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
