name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://pam:pam@localhost:5432/pam
  BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
  BETTER_AUTH_URL: http://localhost:3100

jobs:
  quality:
    name: Lint · types · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: Migrations · import · build · E2E
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: pam, POSTGRES_PASSWORD: pam, POSTGRES_DB: pam }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pam" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations with Prisma
        run: pnpm db:migrate
      - name: Import pipeline on synthetic DVF-shaped files
        run: pnpm db:seed:synthetic
      - name: Re-run import (must be idempotent)
        run: pnpm data:import --dept 34 --years 2025 --source synthetic --source-dir data/fixtures/synthetic
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  docker:
    name: Docker images (push to GHCR on main)
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/tysia-fr/prix-au-meter
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Images are built here, not on the VPS: the server only pulls (saves disk and RAM there).
      - name: App image (runtime)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - name: Tools image (migrations + DVF import)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE }}-tools:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=tools
          cache-to: type=gha,mode=max,scope=tools
